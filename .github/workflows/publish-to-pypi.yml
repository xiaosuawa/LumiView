name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install webkit2gtk
        run: |
          sudo apt-get update
          # libxdo-dev: muda's GTK backend sends predefined-item shortcuts
          # (copy/paste/...) through xdo; bundled into the wheel by
          # auditwheel (no GTK-style global-type-registry concern).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libxdo-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - name: Repair manylinux (exclude system GTK/GLib/dbus — must not bundle)
        run: |
          pip install auditwheel
          # GTK/GLib libraries can never be bundled into the wheel: the
          # GObject type registry is process-global, so a second copy breaks
          # any process that also links the system GTK (LumiView's own tao
          # window and wryview both do). libdbus-1/libsystemd likewise exist
          # on every desktop that can run GTK3 (the gtk .deb depends on
          # them) — bundling them only adds weight and risks version skew.
          auditwheel repair \
            --exclude 'libgtk-3.*' \
            --exclude 'libgdk-3.*' \
            --exclude 'libglib-2.0.*' \
            --exclude 'libgobject-2.0.*' \
            --exclude 'libgio-2.0.*' \
            --exclude 'libgmodule-2.0.*' \
            --exclude 'libgdk_pixbuf-2.0.*' \
            --exclude 'libpango-1.0.*' \
            --exclude 'libpangocairo-1.0.*' \
            --exclude 'libpangoft2-1.0.*' \
            --exclude 'libatk-1.0.*' \
            --exclude 'libharfbuzz.*' \
            --exclude 'libfribidi.*' \
            --exclude 'libepoxy.*' \
            --exclude 'libcairo.*' \
            --exclude 'libcairo-gobject.*' \
            --exclude 'libxkbcommon.*' \
            --exclude 'libwayland-client.*' \
            --exclude 'libdbus-1.*' \
            --exclude 'libsystemd.*' \
            --exclude 'libgcrypt.*' \
            --exclude 'libgpg-error.*' \
            --exclude 'libcap.*' \
            --exclude 'libzstd.*' \
            --exclude 'liblz4.*' \
            --exclude 'liblzma.*' \
            -w dist dist/lumiview-*.whl
          rm -f dist/*-linux_x86_64.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
            python-arch: x86
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python-arch || 'x64' }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  pypi-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, sdist]
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/lumiview/
    steps:
      - uses: actions/checkout@v4

      - name: Validate version match
        shell: pwsh
        run: |
          $pyprojectVersion = (Select-String -Path pyproject.toml -Pattern 'version = "(.+?)"').Matches.Groups[1].Value
          $gitTag = "${{ github.ref }}".Split('/')[-1]
          $gitTagVersion = $gitTag.TrimStart('v')
          if ($pyprojectVersion -ne $gitTagVersion) {
            Write-Error "Version mismatch: pyproject.toml=$pyprojectVersion vs tag=$gitTag"
            exit 1
          }
          Write-Host "Versions match: $pyprojectVersion"

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/