name: Build

# Release wheels. The matrix is the three stable-ABI families PyO3 supports:
#
#   cp310-abi3        GIL-enabled CPython 3.10+   (pyo3/abi3-py310)
#   cp314-cp314t      free-threaded CPython 3.14  (version-specific)
#   cp315-abi3.abi3t  GIL-enabled *and* free-threaded CPython 3.15+
#                     (PEP 803 compressed tag; pyo3/abi3t-py315)
#
# A single maturin build selects at most one stable ABI family, so every
# family gets its own interpreter: 3.12 -> abi3, 3.14t -> cp314t,
# 3.15t -> abi3t. The interpreter is the family switch; do not drop it.
#
# Free-threaded 3.13 is the one supported interpreter without a wheel: PyO3
# can build cp313-cp313t on demand, so those users install from the sdist.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # maturin >= 1.14.1 is required for abi3t, >= 1.15 for the PyModExport
  # entry point check, and >= 1.16 for sorted compressed tag sets.
  MATURIN_VERSION: v1.16.0

jobs:
  wheels:
    name: ${{ matrix.kind }} / ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - { os: ubuntu-latest, target: x86_64, arch: x64, kind: abi3, python: "3.12", tag: cp310-abi3 }
          - { os: ubuntu-latest, target: x86_64, arch: x64, kind: cp314t, python: "3.14t", tag: cp314-cp314t }
          - { os: ubuntu-latest, target: x86_64, arch: x64, kind: abi3t, python: "3.15t", tag: cp315-abi3.abi3t }
          # Windows x64
          - { os: windows-latest, target: x64, arch: x64, kind: abi3, python: "3.12", tag: cp310-abi3 }
          - { os: windows-latest, target: x64, arch: x64, kind: cp314t, python: "3.14t", tag: cp314-cp314t }
          - { os: windows-latest, target: x64, arch: x64, kind: abi3t, python: "3.15t", tag: cp315-abi3.abi3t }
          # Windows x86 (CPython still ships free-threaded 32-bit builds)
          - { os: windows-latest, target: x86, arch: x86, kind: abi3, python: "3.12", tag: cp310-abi3 }
          - { os: windows-latest, target: x86, arch: x86, kind: cp314t, python: "3.14t", tag: cp314-cp314t }
          - { os: windows-latest, target: x86, arch: x86, kind: abi3t, python: "3.15t", tag: cp315-abi3.abi3t }
          # macOS arm64
          - { os: macos-latest, target: aarch64, arch: arm64, kind: abi3, python: "3.12", tag: cp310-abi3 }
          - { os: macos-latest, target: aarch64, arch: arm64, kind: cp314t, python: "3.14t", tag: cp314-cp314t }
          - { os: macos-latest, target: aarch64, arch: arm64, kind: abi3t, python: "3.15t", tag: cp315-abi3.abi3t }
          # macOS x86_64
          - { os: macos-26-intel, target: x86_64, arch: x64, kind: abi3, python: "3.12", tag: cp310-abi3 }
          - { os: macos-26-intel, target: x86_64, arch: x64, kind: cp314t, python: "3.14t", tag: cp314-cp314t }
          - { os: macos-26-intel, target: x86_64, arch: x64, kind: abi3t, python: "3.15t", tag: cp315-abi3.abi3t }
    steps:
      - uses: actions/checkout@v7

      # The page-side JS client is generated (git-ignored) — the wheel needs it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build JS client
        run: |
          npm --prefix js ci
          npm --prefix js run build

      # LumiView itself links GTK, not WebKit (wryview is a Python runtime
      # dependency), but the smoke import below imports wryview, whose
      # extension links libwebkit2gtk at load time. libxdo-dev is needed by
      # muda's GTK backend.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libxdo-dev

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          # Build against the runner's apt-installed GTK/WebKit, not a
          # manylinux container (the wheel is repaired afterwards).
          manylinux: off
          args: --release --locked --out dist --interpreter python

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade "auditwheel>=6.8,<7"
          bash .github/scripts/repair-wheel.sh

      - name: Verify wheel tag and contents
        run: python .github/scripts/verify_wheel.py "${{ matrix.tag }}"

      # A release wheel must at least import on its own interpreter. Until
      # wryview ships cp314t, the 3.14t leg builds wryview from its sdist.
      - name: Smoke import
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip install "wryview~=0.5.5" "cattrs~=26.1" "typing_extensions~=4.11"
          python -c "import lumiview; print(lumiview.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.kind }}
          path: dist/*.whl
          retention-days: 30

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build JS client
        run: |
          npm --prefix js ci
          npm --prefix js run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libxdo-dev
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --out dist
      - name: Verify sdist contents
        run: python .github/scripts/verify_sdist.py
      # Prove the sdist is complete enough to build a wheel without the
      # generated JS file (it must already be inside the archive).
      - name: Build wheel from sdist
        run: python -m pip wheel --no-deps -w /tmp/from-sdist dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          retention-days: 30

  pypi-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/lumiview/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate versions against the tag
        run: python .github/scripts/check_versions.py "${{ github.ref_name }}"
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - name: Check distributions
        run: |
          python -m pip install --upgrade "twine>=7,<8"
          python -m twine check dist/*
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
