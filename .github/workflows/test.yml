name: Test

# Every commit on a PR, and every push to main, runs the cross-platform e2e
# suite. Kept separate from build.yml (which handles release wheels).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATURIN_VERSION: v1.16.0

jobs:
  test:
    name: full test (${{ matrix.os }} / ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - { os: ubuntu-latest, target: x86_64, arch: x64, python: "3.15" }
          - { os: ubuntu-latest, target: x86_64, arch: x64, python: "3.15t" }
          # Windows x64
          - { os: windows-latest, target: x64, arch: x64, python: "3.15" }
          - { os: windows-latest, target: x64, arch: x64, python: "3.15t" }
          # Windows x86 (CPython still ships free-threaded 32-bit builds)
          - { os: windows-latest, target: x86, arch: x86, python: "3.15" }
          - { os: windows-latest, target: x86, arch: x86, python: "3.15t" }
          # macOS arm64
          - { os: macos-latest, target: aarch64, arch: arm64, python: "3.15" }
          - { os: macos-latest, target: aarch64, arch: arm64, python: "3.15t" }
          # macOS x86_64
          - { os: macos-26-intel, target: x86_64, arch: x64, python: "3.15" }
          - { os: macos-26-intel, target: x86_64, arch: x64, python: "3.15t" }

    steps:
      - uses: actions/checkout@v7

      # The page-side JS client is generated (git-ignored) — the wheel needs it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build JS client
        run: |
          npm --prefix js ci
          npm --prefix js run build
          npm --prefix js test

      # Linux: webkit2gtk is the WebKit engine; xvfb provides a virtual X
      # display (LumiView windows are real GTK windows — there is no headless
      # mode, unlike Playwright's Chromium).
      - name: Install Linux webview + Xvfb deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev \
            xvfb

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: off
          args: --release --locked --out dist --interpreter python

      - name: Install lumiview and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pytest
          python -m pip install dist/lumiview-*.whl

      - name: Run pytest (Linux, xvfb + webkit env)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          GDK_BACKEND: "x11"
          NO_AT_BRIDGE: "1"
          WEBKIT_FORCE_SANDBOX: "0"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -ra

      - name: Run pytest (Windows, WebView2 via desktop session)
        if: runner.os == 'Windows'
        run: python -m pytest -ra

      - name: Run pytest (macOS, WebKit via WindowServer)
        if: runner.os == 'macOS'
        run: python -m pytest -ra
